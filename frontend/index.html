<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-uni-bielefeld.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-uni-bielefeld.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_PAGE_TITLE%</title>
    <meta name="description" content="%VITE_PAGE_DESCRIPTION%" />
    <!-- The build passes VITE_PAGE_TITLE, VITE_PAGE_DESCRIPTION, VITE_SITE_URL and VITE_DOI per
         deployment; frontend/build.sh sets all four. Without them the raw placeholders were served
         to visitors and to link previews. -->
    <link rel="canonical" href="%VITE_SITE_URL%" />
    <meta name="robots" content="index, follow, max-snippet:-1" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%VITE_PAGE_TITLE%" />
    <meta property="og:description" content="%VITE_PAGE_DESCRIPTION%" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:site_name" content="GeoLAB, SOEP-RegioHub" />
    <meta name="twitter:card" content="summary" />

    <!-- Structured data. A search interface gives a crawler almost no text of its own, so what it
         is, who runs it and which archived release it corresponds to are stated here explicitly. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "%VITE_PAGE_TITLE%",
        "url": "%VITE_SITE_URL%",
        "description": "%VITE_PAGE_DESCRIPTION%",
        "applicationCategory": "ReferenceApplication",
        "operatingSystem": "Any (web browser)",
        "isAccessibleForFree": true,
        "inLanguage": ["de", "en"],
        "publisher": {
          "@type": "Organization",
          "name": "Leibniz ScienceCampus SOEP-RegioHub, Universität Bielefeld",
          "url": "https://geolab.soz.uni-bielefeld.de"
        },
        "sameAs": "%VITE_DOI%"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>%VITE_PAGE_TITLE%</h1>
      <p>%VITE_PAGE_DESCRIPTION%</p>
      <p>
        The search itself needs JavaScript. What the index holds, where every record comes from and
        how the links are verified is described on the project site:
        <a href="https://geolab.soz.uni-bielefeld.de/">GeoLAB</a>, with the full source list on its
        <a href="https://geolab.soz.uni-bielefeld.de/data-sources.html">data sources</a> page.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
